services:
  app:
    build: .
    image: alumni_app:latest
    container_name: alumni_app
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: php -S 0.0.0.0:8000 index.php
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-alumni_db}
      - DB_USER=${POSTGRES_USER:-alumni_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-alumni_password}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: alumni_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alumni_db}
      POSTGRES_USER: ${POSTGRES_USER:-alumni_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alumni_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: